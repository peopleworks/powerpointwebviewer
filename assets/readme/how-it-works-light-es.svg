<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="how-t how-d">
  <title id="how-t">Cómo funciona el complemento</title>
  <desc id="how-d">La diapositiva contiene el complemento, Office carga viewer.html desde tu servidor HTTPS y el sitio se muestra en vivo en un marco. Los sitios que rechazan marcos se abren en una ventana aparte mediante dialog.html.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
    .cap { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
           font-size: 11px; letter-spacing: .12em; text-transform: uppercase; fill: #5b6673; }
    .title { font-size: 15px; font-weight: 640; fill: #12171d; }
    .body { font-size: 12.5px; fill: #5b6673; }
    .small { font-size: 11.5px; fill: #5b6673; }
  </style>
  <defs>
    <marker id="how-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7684"/>
    </marker>
    <marker id="how-arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8a4c"/>
    </marker>
    <marker id="how-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6cb0"/>
    </marker>
    <marker id="how-arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="900" height="410" fill="#ffffff"/>
  <text class="cap" x="450" y="30" text-anchor="middle">Tres piezas · una diapositiva en vivo</text>
  <rect x="15" y="52" width="266" height="178" rx="12" fill="#f4f6f9" stroke="#d8dee6"/>
  <text class="cap" x="37" y="84">1 · Tu presentación</text>
  <text class="title" x="37" y="112">Una diapositiva</text>
  <text class="body" x="37" y="142">El complemento va en la</text>
  <text class="body" x="37" y="161">diapositiva, como una imagen.</text>
  <text class="body" x="37" y="180">Recuerda su URL</text>
  <text class="body" x="37" y="199">dentro del archivo .pptx.</text>
  <rect x="317" y="52" width="266" height="178" rx="12" fill="rgba(44,108,176,.08)" stroke="#2c6cb0" stroke-width="1.6"/>
  <text class="cap" x="339" y="84" style="fill:#2c6cb0">2 · El complemento</text>
  <text class="title mono" x="339" y="112">viewer.html</text>
  <text class="body" x="339" y="142">Office lo carga desde</text>
  <text class="body" x="339" y="161">tu servidor HTTPS.</text>
  <text class="body" x="339" y="180">Valida la URL y convierte</text>
  <text class="body" x="339" y="199">enlaces de YouTube y Vimeo.</text>
  <rect x="619" y="52" width="266" height="178" rx="12" fill="#f4f6f9" stroke="#d8dee6"/>
  <text class="cap" x="641" y="84">3 · El sitio web</text>
  <text class="title" x="641" y="112">En vivo, en un marco</text>
  <text class="body" x="641" y="142">Desplázate, haz clic y</text>
  <text class="body" x="641" y="161">reproduce video en vivo.</text>
  <text class="body" x="641" y="180">No es una copia:</text>
  <text class="body" x="641" y="199">es el sitio real.</text>
  <path d="M285,141 L311,141" stroke="#6b7684" stroke-width="1.8" fill="none" marker-end="url(#how-arrow)"/>
  <path d="M587,141 L613,141" stroke="#6b7684" stroke-width="1.8" fill="none" marker-end="url(#how-arrow)"/>
  <rect x="15" y="268" width="870" height="116" rx="12" fill="none" stroke="#d8dee6" stroke-dasharray="4 4"/>
  <text class="cap" x="37" y="298">¿El sitio no permite marcos?</text>
  <rect x="37" y="316" width="200" height="50" rx="25" fill="#ffffff" stroke="#1e8a4c" stroke-width="1.6"/>
  <text class="title" x="137" y="346" text-anchor="middle">Botón Window</text>
  <rect x="330" y="316" width="240" height="50" rx="25" fill="#ffffff" stroke="#2c6cb0" stroke-width="1.6"/>
  <text class="title mono" x="450" y="338" text-anchor="middle">dialog.html</text>
  <text class="small" x="450" y="355" text-anchor="middle">mismo dominio del complemento</text>
  <rect x="663" y="316" width="200" height="50" rx="25" fill="#ffffff" stroke="#1e8a4c" stroke-width="1.6"/>
  <text class="title" x="763" y="346" text-anchor="middle">Sitio en otra ventana</text>
  <path d="M241,341 L324,341" stroke="#1e8a4c" stroke-width="1.8" fill="none" marker-end="url(#how-arrow-ok)"/>
  <path d="M574,341 L657,341" stroke="#1e8a4c" stroke-width="1.8" fill="none" marker-end="url(#how-arrow-ok)"/>
  <path d="M450,232 L450,264" stroke="#6b7684" stroke-width="1.8" fill="none" stroke-dasharray="3 4" marker-end="url(#how-arrow)"/>

</svg>
